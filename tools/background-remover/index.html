<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إزالة الخلفية | WebBag</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

<header>

<a class="back-btn" href="../../index.html">
⬅ العودة إلى WebBag
</a>

<h1>🖼️ إزالة الخلفية</h1>

<p>

أزل خلفية أي صورة بالذكاء الاصطناعي مباشرة داخل المتصفح.

</p>

</header>

<section class="upload-section">

<label class="upload-box">

<input
type="file"
id="imageInput"
accept="image/*"
hidden>

<div class="upload-icon">

📤

</div>

<h3>

اختر صورة

</h3>

<p>

PNG - JPG - WEBP

</p>

</label>

</section>

<section class="preview-section">

<div class="preview-card">

<h2>

الصورة الأصلية

</h2>

<img
id="originalPreview"
alt="Original">

</div>

<div class="preview-card">

<h2>

بعد إزالة الخلفية

</h2>

<img
id="resultPreview"
alt="Result">

</div>

</section>

<section class="actions">

<button id="removeBtn">

إزالة الخلفية

</button>

<button id="downloadBtn">

تحميل PNG

</button>

</section>

<footer>

<span>

Powered by WebBag Engine

</span>

</footer>

</div>

<script type="module">

import { removeBackground }
from "https://cdn.jsdelivr.net/npm/@imgly/background-removal/+esm";

window.removeBackground = removeBackground;

</script>

<script src="app.js"></script>

</body>

  </html>
