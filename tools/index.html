<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إزالة الخلفية | WebBag</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>🖼️ إزالة الخلفية</h1>

<p class="subtitle">

أزل خلفية أي صورة بالذكاء الاصطناعي مباشرة داخل المتصفح.

</p>

<div class="upload-box">

<input
type="file"
id="imageInput"
accept="image/*">

</div>

<div class="preview-section">

<div class="preview-box">

<h3>الصورة الأصلية</h3>

<img id="originalPreview">

</div>

<div class="preview-box">

<h3>بعد إزالة الخلفية</h3>

<img id="resultPreview">

</div>

</div>

<button id="removeBtn">

إزالة الخلفية

</button>

<button id="downloadBtn">

تحميل PNG

</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal/dist/browser.js"></script>

<script src="app.js"></script>

</body>

</html>
